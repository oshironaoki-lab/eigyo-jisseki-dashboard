<title>宣伝 営業実績ダッシュボード</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a3aa7">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="営業実績">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root {
    color-scheme: light;
    --bg: #f5f5f2; --page: #f9f9f7; --surface: #ffffff; --surface-2: #eeede6;
    --text: #17160f; --text-secondary: #57554c; --text-muted: #8c897d;
    --border: rgba(23,22,15,0.11); --border-strong: rgba(23,22,15,0.22);
    --shadow: 0 1px 2px rgba(23,22,15,0.04), 0 8px 20px -14px rgba(23,22,15,0.22);
    --shadow-hero: 0 2px 4px rgba(23,22,15,0.06), 0 14px 32px -16px rgba(23,22,15,0.30);
    --shadow-sm: 0 1px 1px rgba(23,22,15,0.03);

    /* categorical (dataviz skill default palette, slots 1/2/3/4 + violet-7 for company) */
    --g1: #2a78d6; --g2: #eb6834; --g3: #1baf7a; --content: #eda100; --all: #4a3aa7;
    /* status (fixed, never themed) */
    --good: #0ca30c; --warn: #c98500; --bad: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #16150f; --page: #0d0d0c; --surface: #1f1e17; --surface-2: #28261d;
      --text: #f1efe6; --text-secondary: #c2bfb2; --text-muted: #948f80;
      --border: rgba(241,239,230,0.13); --border-strong: rgba(241,239,230,0.24);
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 20px -14px rgba(0,0,0,0.6);
      --shadow-hero: 0 2px 4px rgba(0,0,0,0.4), 0 16px 36px -16px rgba(0,0,0,0.7);
      --shadow-sm: 0 1px 1px rgba(0,0,0,0.3);
      --g1: #3987e5; --g2: #d95926; --g3: #199e70; --content: #c98500; --all: #9085e9;
      --good: #1fbf3d; --warn: #e0ab4a; --bad: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #16150f; --page: #0d0d0c; --surface: #1f1e17; --surface-2: #28261d;
    --text: #f1efe6; --text-secondary: #c2bfb2; --text-muted: #948f80;
    --border: rgba(241,239,230,0.13); --border-strong: rgba(241,239,230,0.24);
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 20px -14px rgba(0,0,0,0.6);
    --shadow-hero: 0 2px 4px rgba(0,0,0,0.4), 0 16px 36px -16px rgba(0,0,0,0.7);
    --shadow-sm: 0 1px 1px rgba(0,0,0,0.3);
    --g1: #3987e5; --g2: #d95926; --g3: #199e70; --content: #c98500; --all: #9085e9;
    --good: #1fbf3d; --warn: #e0ab4a; --bad: #e66767;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--page); color: var(--text);
    font-family: -apple-system, "SF Pro JP", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
    line-height: 1.55; font-feature-settings: "palt" 1;
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  button, summary { font-family: inherit; -webkit-tap-highlight-color: transparent; }
  summary { cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }

  /* ---- Header ---- */
  header.top {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding-top: env(safe-area-inset-top);
  }
  .top-inner { max-width: 480px; margin: 0 auto; padding: 10px 16px 0; }
  .top-title { font-size: 11px; letter-spacing: .1em; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
  .top-h1 { font-size: 21px; font-weight: 800; margin: 4px 0 2px; letter-spacing: -0.01em; }
  .top-sub { font-size: 12.5px; color: var(--text-muted); margin-bottom: 10px; }
  .top-datebar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; row-gap: 6px; column-gap: 10px; margin-bottom: 10px; }
  .top-date { font-weight: 700; color: var(--text-secondary); font-size: 13px; }
  .top-date .stale { color: var(--warn); font-weight: 800; }
  .refresh-btn {
    -webkit-appearance: none; appearance: none; border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text); font: inherit; font-size: 12.5px; font-weight: 700;
    padding: 8px 14px; border-radius: 999px; cursor: pointer; flex: none; min-height: 34px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background .15s, transform .15s;
  }
  .refresh-btn:active { transform: scale(.96); }
  .refresh-btn .ic { display: inline-block; transition: transform .5s ease; }
  .refresh-btn.spinning .ic { animation: spin .6s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .refresh-btn.spinning .ic { animation: none; } }

  /* ---- Tabs (horizontal scroll, no cut-off) ---- */
  .tabs {
    display: flex; gap: 5px; overflow-x: auto; scroll-snap-type: x proximity;
    padding-bottom: 10px;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    appearance: none; border: 1px solid var(--border); background: var(--surface);
    color: var(--text-secondary); font: inherit; font-size: 13px; font-weight: 700;
    padding: 9px 4px; border-radius: 999px; cursor: pointer; flex: 1 1 0; min-width: 0; min-height: 40px;
    scroll-snap-align: start; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-align: center;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tab-btn[aria-selected="true"] { background: var(--tab-c, var(--all)); border-color: var(--tab-c, var(--all)); color: #fff; }
  .tab-btn[data-tab="all"] { --tab-c: var(--all); }
  .tab-btn[data-tab="g1"] { --tab-c: var(--g1); }
  .tab-btn[data-tab="g2"] { --tab-c: var(--g2); }
  .tab-btn[data-tab="g3"] { --tab-c: var(--g3); }
  .tab-btn[data-tab="content"] { --tab-c: var(--content); }

  .report-link-row { padding-bottom: 12px; }
  .report-link {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; appearance: none; border: 1px dashed var(--border-strong);
    background: transparent; color: var(--text-secondary);
    font: inherit; font-size: 12.5px; font-weight: 700;
    padding: 10px; border-radius: 10px; text-decoration: none; min-height: 40px;
  }
  .report-link:active { background: var(--surface-2); }

  main { max-width: 480px; margin: 0 auto; padding: 16px 16px 0; }
  .panel { display: none; }
  .panel.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .panel.active { animation: none; } }

  .guide { font-size: 12.5px; color: var(--text-muted); margin: 0 0 16px; line-height: 1.7; }

  h2.sec { font-size: 16px; font-weight: 800; margin: 30px 0 12px; letter-spacing: 0;
    display: flex; align-items: center; gap: 8px; }
  h2.sec .bar { width: 4px; height: 16px; border-radius: 2px; background: var(--sec-c, var(--text)); display: inline-block; }
  .panel > .blk:first-child > h2.sec:first-child { margin-top: 0; }

  /* ---- Hero card (this month landing estimate) ---- */
  .hero {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 20px 18px; box-shadow: var(--shadow-hero); margin-bottom: 10px;
    border-top: 3px solid var(--hero-c, var(--good));
  }
  .hero-lbl { font-size: 12.5px; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; }
  .hero-num { font-size: 38px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--hero-c, var(--good)); }
  .hero-num .unit { font-size: 16px; font-weight: 700; margin-left: 3px; color: var(--text-secondary); }
  .hero-num-note { font-size: 13px; font-weight: 600; margin-left: 6px; color: var(--text-muted); letter-spacing: 0; }
  .hero-sub { font-size: 13px; color: var(--text-secondary); margin-top: 7px; }
  .hero-chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 13px; }
  .chip-col { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .chip-note { font-size: 11px; color: var(--text-muted); padding-left: 2px; font-variant-numeric: tabular-nums; }
  .chip-note b { font-weight: 800; }
  .chip-note b.good { color: var(--good); } .chip-note b.warn { color: var(--warn); } .chip-note b.bad { color: var(--bad); }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700;
    padding: 6px 12px; border-radius: 999px; background: var(--surface-2); color: var(--text-secondary);
  }
  .chip.good { background: color-mix(in srgb, var(--good) 16%, var(--surface)); color: var(--good); }
  .chip.warn { background: color-mix(in srgb, var(--warn) 18%, var(--surface)); color: var(--warn); }
  .chip.bad  { background: color-mix(in srgb, var(--bad) 16%, var(--surface));  color: var(--bad); }

  /* ---- Detail disclosure ---- */
  details.more { margin-bottom: 14px; }
  details.more > summary {
    display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700;
    color: var(--text-secondary); padding: 10px 2px; min-height: 40px;
  }
  details.more > summary::before { content: '▸'; font-size: 10px; color: var(--text-muted); transition: transform .15s; }
  details.more[open] > summary::before { transform: rotate(90deg); }
  .more-body {
    font-size: 14px; line-height: 1.8; color: var(--text-secondary);
    background: var(--surface-2); border-radius: 12px; padding: 13px 14px; margin-top: 2px;
  }
  .more-body b { color: var(--text); }

  /* ---- Metric row: bar + reference tick + big % + signed-delta note ----
     Replaces ring gauges everywhere on the page (KPI cards, YoY, group
     rows) with one consistent pattern: a single bar shows the primary
     value, a tick mark shows where the reference point (plan / last
     year) sits, and the note line always spells out the actual amount
     and the signed yen difference so "better or worse" never depends
     on reading a bar length. */
  .metric-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .metric-row:first-of-type { margin-top: 16px; }
  .metric-lbl { width: 46px; font-size: 11.5px; font-weight: 700; color: var(--text-muted); flex: none; }
  .metric-track { flex: 1; min-width: 60px; position: relative; height: 9px; background: var(--surface-2); border-radius: 4px; }
  .metric-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 4px; background: var(--mc, var(--all)); }
  .metric-fill.alt { background: var(--text-muted); opacity: .55; }
  .metric-tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .5; }
  .metric-pct { width: 64px; text-align: right; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; flex: none; }
  .metric-pct.good { color: var(--good); } .metric-pct.warn { color: var(--warn); } .metric-pct.bad { color: var(--bad); }
  .metric-note { font-size: 11.5px; color: var(--text-muted); margin: 3px 0 0 58px; font-variant-numeric: tabular-nums; }
  .metric-note b { font-weight: 800; }
  .metric-note b.good { color: var(--good); } .metric-note b.warn { color: var(--warn); } .metric-note b.bad { color: var(--bad); }

  /* ---- Sparkline ---- */
  .spark-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 15px; box-shadow: var(--shadow-sm); margin-bottom: 14px; }
  .spark-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; margin-bottom: 8px; }
  .spark-top .t { font-size: 13px; font-weight: 800; white-space: nowrap; }
  .spark-top .v { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .spark-svg { width: 100%; height: 60px; display: block; }
  /* The viewBox is small and non-uniformly stretched (preserveAspectRatio="none") to fill
     whatever width the chart has, which is much wider on desktop — without this, strokes
     get squashed thin in one axis and read as blurry/low-res at desktop width. */
  .spark-svg polyline, .spark-svg line, .spark-svg circle { vector-effect: non-scaling-stroke; }
  .spark-ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .spark-legend { display: flex; gap: 16px; margin-top: 10px; font-size: 11px; color: var(--text-secondary); flex-wrap: wrap; }
  .spark-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .spark-legend i { width: 14px; height: 0; display: inline-block; border-top: 2.5px solid currentColor; }
  .spark-legend .plan i { border-top: 2px dashed var(--text-muted); }
  .spark-legend .prior i { border-top: 2px dotted var(--border-strong); }

  /* ---- Monthly bars (detail) ---- */
  .mbars { display: flex; flex-direction: column; gap: 12px; margin: 2px 0 4px; }
  .mbar-row .mbar-label { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; margin-bottom: 5px; }
  .mbar-row .mbar-label .v { font-variant-numeric: tabular-nums; color: var(--text-muted); font-weight: 600; font-size: 11.5px; }
  .mbar-track { position: relative; height: 14px; background: var(--surface-2); border-radius: 4px; }
  .mbar-fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: 4px; background: var(--mc, var(--all)); }
  .mbar-plan { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .5; }
  .mbar-row.forecast .mbar-fill { background: repeating-linear-gradient(135deg, var(--mc, var(--all)) 0 4px, color-mix(in srgb, var(--mc, var(--all)) 55%, transparent) 4px 8px); }
  .mbar-row.forecast .mbar-track { border: 1px dashed var(--border-strong); }
  .fc-tag { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 999px; margin-left: 5px; background: var(--surface-2); color: var(--text-muted); vertical-align: middle; }

  /* ---- Table (inside details) ---- */
  .tblwrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
  table.dt { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 460px; }
  table.dt th, table.dt td { padding: 9px 9px; text-align: right; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.dt th:first-child, table.dt td:first-child { text-align: left; font-variant-numeric: normal; position: sticky; left: 0; background: var(--surface); }
  table.dt thead th { color: var(--text-muted); font-weight: 700; font-size: 11px; background: var(--surface-2); }
  table.dt tbody tr:last-child td { border-bottom: none; }
  table.dt tr.tot td { font-weight: 800; background: var(--surface-2); }

  /* ---- Group summary rows (tappable, jumps to that tab) ---- */
  .grow {
    display: block; width: 100%; text-align: left; appearance: none; border: 1px solid var(--border);
    background: var(--surface); border-radius: 14px; padding: 13px 14px; margin-bottom: 9px; box-shadow: var(--shadow);
    cursor: pointer; min-height: 44px;
  }
  .grow:active { background: var(--surface-2); }
  .grow-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .grow-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; background: var(--gc); }
  .grow-name { font-size: 14.5px; font-weight: 800; color: var(--text); }
  .grow .metric-fill { background: var(--gc); }
  .grow .metric-fill.alt { background: var(--text-muted); }
  .grow .metric-row:first-of-type { margin-top: 10px; }

  /* ---- YoY block (solo, per-group panel) ---- */
  .yoy-block { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 15px; box-shadow: var(--shadow-sm); margin-bottom: 10px; }

  /* ---- Topics (quieter than the numeric cards: flat, left accent, no shadow) ---- */
  .topic-card {
    background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--topic-c, var(--border-strong));
    border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
  }
  .topic-card .cli { font-size: 12px; color: var(--text-muted); font-weight: 700; margin-bottom: 3px; }
  .topic-card .desc { font-size: 14px; line-height: 1.7; }
  .topic-card .who { font-size: 12px; color: var(--text-muted); margin-left: 3px; }
  /* Category labels, not status signals — deliberately neutral so they never read as good/warn/bad achievement colors do elsewhere on the page */
  .tag { display: inline-block; font-size: 10.5px; padding: 2px 7px; border-radius: 999px; font-weight: 800; margin-left: 5px; vertical-align: middle;
    background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border-strong); }

  .callout { border-radius: 14px; padding: 13px 14px; background: var(--surface-2); font-size: 14px; line-height: 1.75; margin-bottom: 10px; }
  .callout .ct { font-weight: 800; font-size: 13.5px; margin-bottom: 6px; }

  /* ---- Client trends (YoY ledger diff: grown / no-longer-seen clients) ---- */
  .ctr-cols { display: flex; flex-direction: column; gap: 20px; }
  .ctr-col-title { font-size: 12.5px; font-weight: 800; margin-bottom: 8px; }
  .ctr-col-title.good { color: var(--good); }
  .ctr-col-title.muted { color: var(--text-muted); }
  .ctr-item { border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; margin-bottom: 8px; background: var(--surface); }
  .ctr-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .ctr-name { font-size: 13.5px; font-weight: 800; }
  .ctr-amt { font-size: 12.5px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
  .ctr-amt.good { color: var(--good); }
  .ctr-amt.muted { color: var(--text-muted); font-weight: 700; }
  .ctr-note { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .ctr-desc { font-size: 12.5px; color: var(--text-secondary); margin-top: 4px; }

  /* ---- Swing factors (4-8月 YoY deal-level increase/decrease cards) ---- */
  .swf-grid { display: flex; flex-direction: column; gap: 9px; }
  .swf-item { border: 1px solid var(--border); border-left: 3px solid var(--border-strong); border-radius: 10px; padding: 11px 13px; background: var(--surface); }
  .swf-top { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; }
  .swf-month { font-size: 13.5px; font-weight: 800; white-space: nowrap; }
  .swf-label { font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border-strong); white-space: nowrap; }
  .swf-deals { display: flex; flex-direction: column; }
  .swf-deal { display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 10px; padding: 6px 0; }
  .swf-deal + .swf-deal { border-top: 1px dashed var(--border); }
  .swf-dir { flex: none; font-size: 13px; font-weight: 800; width: 14px; }
  .swf-dir.up { color: var(--good); } .swf-dir.down { color: var(--bad); } .swf-dir.flat { color: var(--text-muted); }
  .swf-deal-main { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; }
  .swf-deal-client { font-size: 12.5px; font-weight: 800; }
  .swf-deal-desc { font-size: 11.5px; color: var(--text-muted); }
  .swf-deal-amount { flex: none; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .swf-deal-amount.up { color: var(--good); } .swf-deal-amount.down { color: var(--bad); } .swf-deal-amount.flat { color: var(--text-muted); }
  .swf-note { font-size: 12px; line-height: 1.7; color: var(--text-secondary); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
  .swf-note b { color: var(--text); font-weight: 700; }

  footer.pagefoot { max-width: 480px; margin: 30px auto 0; padding: 16px; font-size: 11.5px; color: var(--text-muted); line-height: 1.8; border-top: 1px solid var(--border);
    padding-bottom: calc(16px + env(safe-area-inset-bottom)); }

  /* ================= Desktop layout (PC) =================
     Not a stretched phone layout: mobile uses padded shadow-cards
     because attention is sequential (one thing per screen-scroll).
     Desktop sees everything at once, so this flattens the same
     components into bordered rows/strips — alignment and rhythm
     carry the hierarchy instead of per-item padding and shadow. */
  @media (min-width: 1024px) {
    .top-inner, main, footer.pagefoot { max-width: 1180px; }
    .top-inner { padding: 20px 32px 0; }
    main { padding: 32px 32px 0; }
    footer.pagefoot { padding: 20px 32px; }

    .top-h1 { font-size: 26px; margin: 5px 0 3px; }
    .top-sub { font-size: 13.5px; margin-bottom: 16px; }
    .top-date { font-size: 13.5px; }
    .top-datebar { margin-bottom: 16px; }

    /* Flat underline tabs + secondary link share one bordered row (real app toolbar, not stacked mobile chrome) */

    /* Topic cards: true masonry so a short card never leaves a gap beside a tall neighbor.

    .topics-grid { columns: 3; column-gap: 16px; }

        { cli: "沖縄アニメーションフェスティバル", desc: "「沖縄アニメーションフェスティバル2027」運営 ― 開催日：2027年1月29日〜1月31日　場所：新報ホール・パレット前広場・市民劇場" }
      ]
    }
  }
};
/* DATA:END */
</script>
<script>
(function () {
  "use strict";
  var fmt = function (n) { return (n < 0 ? "▲" : "") + Math.abs(n).toLocaleString("ja-JP"); };
  var fmtSigned = function (n) { var r = Math.round(n); return (r < 0 ? "▲" : "+") + Math.abs(r).toLocaleString("ja-JP"); };
  // 対計画（進行中の予算消化率）はまだ月末までに動く数字なので甘め、対前年（確定した実績同士の比較）は厳しめに判定する。
  var toneAchieve = function (pct) { return pct >= 100 ? "good" : pct >= 80 ? "warn" : "bad"; };
  var toneYoy = function (pct) { return pct >= 100 ? "good" : pct >= 94 ? "warn" : "bad"; };
  var ringColorVar = function (t) { return t === "good" ? "var(--good)" : t === "warn" ? "var(--warn)" : "var(--bad)"; };
  // バーの塗り幅はmin(達成率,100)%。計画の目印線は「実績を基準にしたときの計画の相対位置」＝達成率>=100%なら10000/達成率、未満なら右端(100%)。
  var planMarkerPos = function (pct) { return pct >= 100 ? Math.min(100, 10000 / pct) : 100; };

  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }

  function heroSection(scope) {
    var m = scope.monthly; if (!m) return "";
    var t = toneAchieve(m.profit.achievePct);
    // コンテンツの当月実績が台帳に反映され次第、この注記は自動的に表示されなくなる。
    var landingNote = (scope === DATA.scopes.all && !DATA.scopes.content.monthly) ? "（コンテンツ未記載の為除く）" : "";
    return '' +
      '<h2 class="sec" style="--sec-c:var(--' + scope.color + ')"><span class="bar"></span>' + esc(m.title) + '</h2>' +
      '<div class="guide">' + esc(m.note) + '</div>' +
      '<div class="hero" style="--hero-c:' + ringColorVar(t) + '">' +
        '<div class="hero-lbl">利益（粗利）・着地見込</div>' +
        '<div class="hero-num">' + fmt(m.profit.landing) + '<span class="unit">千円</span>' + (landingNote ? '<span class="hero-num-note">' + esc(landingNote) + '</span>' : '') + '</div>' +
        '<div class="hero-sub">実績 ' + fmt(m.profit.actual) + '千円（本日時点）</div>' +
        '<div class="hero-chips">' +
          '<div class="chip-col"><span class="chip ' + t + '">対計画 ' + m.profit.achievePct + '%</span><span class="chip-note">計画' + fmt(m.profit.plan) + '千円（<b class="' + t + '">' + fmtSigned(m.profit.landing - m.profit.plan) + '</b>千円）</span></div>' +
          '<div class="chip-col"><span class="chip ' + toneYoy(m.profit.yoyPct) + '">対前年同月 ' + m.profit.yoyPct + '%</span><span class="chip-note">前年' + fmt(m.profit.yoyPrior) + '千円（<b class="' + toneYoy(m.profit.yoyPct) + '">' + fmtSigned(m.profit.landing - m.profit.yoyPrior) + '</b>千円）</span></div>' +
        '</div>' +
      '</div>' +
      '<details class="more"><summary>参考：売上ベースの数字・詳しい内訳を見る</summary><div class="more-body">' +
        '<p><b>参考：売上・着地見込 ' + fmt(m.sales.landing) + '千円</b>（実績 ' + fmt(m.sales.actual) + '千円）／対計画 ' + m.sales.achievePct + '%（計画' + fmt(m.sales.plan) + '）／対前年同月 ' + m.sales.yoyPct + '%（前年' + fmt(m.sales.yoyPrior) + '）</p>' +
        '<p>' + m.detail + '</p>' +
      '</div></details>';
  }

  function metricRow(label, pct, tone, color, alt, note) {
    return '' +
      '<div class="metric-row"><span class="metric-lbl">' + esc(label) + '</span>' +
        '<div class="metric-track"><div class="metric-fill' + (alt ? ' alt' : '') + '" style="width:' + Math.min(pct,100) + '%' + (color ? ';--mc:' + color : '') + '"></div><div class="metric-tick" style="left:' + planMarkerPos(pct) + '%"></div></div>' +
        '<span class="metric-pct ' + tone + '">' + pct + '%</span></div>' +
      '<div class="metric-note">' + note + '</div>';
  }

  function ytdKpis(scope) {
    var y = scope.ytd; if (!y) return "";
    var mc = "var(--" + scope.color + ")";
    var pt = toneAchieve(y.profit.achievePct);
    var planDelta = y.profit.actual - y.profit.plan;
    var metricsHtml = metricRow("対計画", y.profit.achievePct, pt, mc, false,
      "実績" + fmt(y.profit.actual) + "千円（計画比 <b class=\"" + pt + "\">" + fmtSigned(planDelta) + "</b>千円）");

    var secondHtml = "";
    if (y.profit.yoyPct != null) {
      var yt = toneYoy(y.profit.yoyPct);
      var yoyDelta = y.profit.actual - (y.profit.yoyPrior || 0);
      secondHtml = metricRow("対前年", y.profit.yoyPct, yt, null, true,
        "実績" + fmt(y.profit.actual) + "千円（前年比 <b class=\"" + yt + "\">" + fmtSigned(yoyDelta) + "</b>千円）");
      if (scope.yoy && scope.yoy.note) secondHtml += '<div class="guide" style="margin:6px 0 0;">' + esc(scope.yoy.note) + '</div>';
      if (scope.yoy && scope.yoy.detail) secondHtml += '<details class="more"><summary>調整の内訳を見る</summary><div class="more-body"><p>' + scope.yoy.detail + '</p></div></details>';
    }
    if (y.profit.planFull != null) {
      secondHtml += '<div class="guide" style="margin:10px 0 0;">通期計画' + fmt(y.profit.planFull) + (y.profit.marginPct != null ? '（粗利率' + y.profit.marginPct + '%）' : '') + '</div>';
    }

    var salesRef = metricRow("対計画", y.sales.achievePct, toneAchieve(y.sales.achievePct), mc, false,
      "実績" + fmt(y.sales.actual) + "千円／計画" + fmt(y.sales.plan) + "千円");
    if (y.sales.yoyPct != null) {
      salesRef += metricRow("対前年", y.sales.yoyPct, toneYoy(y.sales.yoyPct), null, true,
        "実績" + fmt(y.sales.actual) + "千円／前年" + fmt(y.sales.yoyPrior || 0) + "千円");
    }

    return '' +
      '<h2 class="sec" style="--sec-c:var(--' + scope.color + ')"><span class="bar"></span>' + esc(y.title) + '</h2>' +
      (y.forecastNote ? '<div class="guide" style="margin-top:-6px;">' + esc(y.forecastNote) + '</div>' : '') +
      metricsHtml + secondHtml +
      '<details class="more"><summary>参考：売上ベースの計画達成率・前年比を見る</summary><div class="more-body">' + salesRef + '</div></details>';
  }

  function sparkline(trend, color) {
    var w = 300, h = 60, padTop = 4, padBottom = 6;
    var allVals = [];
    trend.forEach(function (d) {
      allVals.push(d.actual);
      if (d.plan != null) allVals.push(d.plan);
      if (d.prior != null) allVals.push(d.prior);
    });
    var max = Math.max.apply(null, allVals) * 1.08;
    var min = Math.min.apply(null, allVals) * 0.85;
    function toXY(v, i) {
      var x = padTop + (i / (trend.length - 1)) * (w - padTop * 2);
      var y = padTop + (1 - (v - min) / (max - min || 1)) * (h - padTop - padBottom);
      return [Number(x.toFixed(1)), Number(y.toFixed(1))];
    }
    var aPts = trend.map(function (d, i) { var p = toXY(d.actual, i); return { x: p[0], y: p[1], forecast: !!d.forecast }; });
    var lastForecast = aPts.length && aPts[aPts.length - 1].forecast;
    var solidPts = lastForecast ? aPts.slice(0, -1) : aPts;
    var segs = [];
    for (var i = 1; i < solidPts.length; i++) {
      segs.push('<line x1="' + solidPts[i-1].x + '" y1="' + solidPts[i-1].y + '" x2="' + solidPts[i].x + '" y2="' + solidPts[i].y + '" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round"/>');
    }
    if (lastForecast && aPts.length > 1) {
      var a = aPts[aPts.length - 2], b = aPts[aPts.length - 1];
      segs.push('<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3"/>');
    }
    var dots = aPts.map(function (p) {
      return p.forecast
        ? '<circle cx="' + p.x + '" cy="' + p.y + '" r="3.5" fill="var(--surface)" stroke="' + color + '" stroke-width="2"/>'
        : '<circle cx="' + p.x + '" cy="' + p.y + '" r="3" fill="' + color + '"/>';
    }).join("");
    function refLine(key, dash, strokeColor) {
      var has = trend.every(function (d) { return d[key] != null; });
      if (!has) return "";
      var pts = trend.map(function (d, i) { var p = toXY(d[key], i); return p[0] + ',' + p[1]; }).join(" ");
      return '<polyline points="' + pts + '" fill="none" stroke="' + strokeColor + '" stroke-width="2" stroke-dasharray="' + dash + '" stroke-linecap="round"/>';
    }
    var planLine = refLine("plan", "6 4", "var(--text-muted)");
    var priorLine = refLine("prior", "1 4", "var(--border-strong)");
    return '<svg class="spark-svg" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img" aria-label="月次粗利の推移（実績・計画・前年実績）">' +
      planLine + priorLine + segs.join("") + dots + '</svg>';
  }

  function trendSection(scope) {
    var y = scope.ytd; if (!y || !y.monthlyTrend) return "";
    var color = "var(--" + scope.color + ")";
    var last = y.monthlyTrend[y.monthlyTrend.length - 1];
    var hasPlan = y.monthlyTrend.every(function (d) { return d.plan != null; });
    var hasPrior = y.monthlyTrend.every(function (d) { return d.prior != null; });
    var needsAdjustNote = scope.color === "g1" || scope.color === "g2" || scope.color === "g3";
    return '' +
      '<h2 class="sec" style="--sec-c:var(--' + scope.color + ')"><span class="bar"></span>月次推移（粗利＝利益ベース）</h2>' +
      '<div class="spark-wrap">' +
        '<div class="spark-top"><span class="t">直近' + y.monthlyTrend.length + 'カ月の粗利トレンド</span><span class="v">' + last.m + ' ' + fmt(last.actual) + '千円（達成率' + last.pct + '%）' + (last.forecast ? '<span class="fc-tag">予測</span>' : '') + '</span></div>' +
        sparkline(y.monthlyTrend, color) +
        '<div class="spark-ticks">' + y.monthlyTrend.map(function(d){return '<span>'+d.m+(d.forecast?'※':'')+'</span>';}).join("") + '</div>' +
        '<div class="spark-legend">' +
          '<span style="color:' + color + '"><i></i>実績</span>' +
          (hasPlan ? '<span class="plan"><i></i>計画</span>' : '') +
          (hasPrior ? '<span class="prior"><i></i>前年実績</span>' : '') +
        '</div>' +
      '</div>' +
      (y.monthlyTrend.some(function(d){return d.forecast;}) ? '<div class="guide" style="margin-top:-8px;">※は確定実績ではなく、台帳の実績＋積上げによる着地予測です。</div>' : '') +
      (needsAdjustNote ? '<div class="guide" style="margin-top:-8px;">前年実績線は4〜7月が担当者異動調整前、8月は調整後の数値です（調整の詳細は「対前年」セクション参照）。</div>' : '') +
      '<details class="more"><summary>月別の実績・計画を見る</summary><div class="more-body">' +
        '<div class="mbars">' + y.monthlyTrend.map(function (d) {
          var t = toneAchieve(d.pct);
          return '<div class="mbar-row' + (d.forecast ? ' forecast' : '') + '"><div class="mbar-label"><span>' + d.m + (d.forecast ? '<span class="fc-tag">予測</span>' : '') + '</span><span class="v">' + (d.forecast ? '着地見込' : '実績') + fmt(d.actual) + '／計画' + fmt(d.plan) + '（' + d.pct + '%）</span></div>' +
            '<div class="mbar-track"><div class="mbar-fill" style="width:' + Math.min(d.pct,100) + '%;--mc:' + ringColorVar(t) + '"></div><div class="mbar-plan" style="left:' + planMarkerPos(d.pct) + '%"></div></div></div>';
        }).join("") + '</div>' +
        (y.trendNote ? '<p style="margin-top:10px;">' + y.trendNote + '</p>' : '') +
        (y.monthlyTable ? tableHtml(y.monthlyTable) : '') +
      '</div></details>';
  }

  function tableHtml(t) {
    var rows = t.rows.slice();
    if (t.total) rows.push(t.total);
    return '<div class="tblwrap" style="margin-top:10px;"><table class="dt"><thead><tr>' +
      t.headers.map(function(h){return '<th>'+esc(h)+'</th>';}).join("") + '</tr></thead><tbody>' +
      rows.map(function(r, i){ return '<tr' + (t.total && i === rows.length-1 ? ' class="tot"' : '') + '>' + r.map(function(c){return '<td>'+esc(c)+'</td>';}).join("") + '</tr>'; }).join("") +
      '</tbody></table></div>';
  }

  function groupsSection(scope) {
    if (!scope.groups) return "";
    var yc = scope.yoyCompare;
    var yoyByKey = {};
    if (yc) yc.rows.forEach(function (r) { yoyByKey[r.key] = r; });
    var rowsHtml = scope.groups.map(function (g) {
      var pt = toneAchieve(g.pct);
      var planDelta = g.profitActual - g.profitPlan;
      var yr = yoyByKey[g.key];
      var yoyHtml = "";
      if (yr) {
        var yt = toneYoy(yr.pct);
        var yoyDelta = yr.thisYear - yr.lastYear;
        yoyHtml = metricRow("対前年", yr.pct, yt, null, true,
          "実績" + fmt(yr.thisYear) + "千円（前年比 <b class=\"" + yt + "\">" + fmtSigned(yoyDelta) + "</b>千円）");
      }
      return '<button class="grow" style="--gc:var(--' + g.key + ')" data-jump="' + g.key + '">' +
        '<div class="grow-top"><span class="grow-dot"></span><span class="grow-name">' + esc(g.name) + (g.note ? '<span class="fc-tag">' + esc(g.note) + '</span>' : '') + '</span></div>' +
        metricRow("対計画", g.pct, pt, "var(--" + g.key + ")", false,
          "実績" + fmt(g.profitActual) + "千円（計画比 <b class=\"" + pt + "\">" + fmtSigned(planDelta) + "</b>千円）") +
        yoyHtml +
      '</button>';
    }).join("");
    var detailTable = yc ? '<details class="more"><summary>グループ別の詳細な数値表を見る</summary><div class="more-body">' + tableHtml(yc.table) + '</div></details>' : "";
    return '' +
      '<h2 class="sec" style="--sec-c:var(--all)"><span class="bar"></span>' + esc(scope.groupsTitle || "グループ別進捗（利益ベース）") + '</h2>' +
      (yc ? '<div class="guide" style="margin-top:-6px;">' + esc(yc.note) + '</div>' : '') +
      '<div class="grows-grid">' + rowsHtml + '</div>' +
      '<div class="callout"><div class="ct">🔍 グループ別の見方</div>' + esc(scope.groupsNote) + '</div>' +
      detailTable;
  }

  function crossTopicsSection(scope) {
    if (!scope.crossTopics) return "";
    return '<h2 class="sec" style="--sec-c:var(--all)"><span class="bar"></span>グループ横断の気づき</h2>' +
      scope.crossTopics.map(function (blk) {
        return '<div class="callout"><div class="ct">💡 ' + esc(blk.title) + '</div><ul style="margin:4px 0 0;padding-left:18px;line-height:1.9;">' +
          blk.items.map(function (it) { return '<li>' + it + '</li>'; }).join("") + '</ul></div>';
      }).join("");
  }

  function clientTrendsSection(scope) {
    var ct = scope.clientTrends; if (!ct) return "";
    function item(it, kind) {
      var isGrown = kind === "grown";
      var amt = isGrown
        ? '<span class="ctr-amt good">利益 ' + fmtSigned(it.delta) + '千円</span>'
        : '<span class="ctr-amt muted">前年利益のみ</span>';
      var note = isGrown
        ? '今年の利益' + fmt(it.thisYear) + '千円（前年' + fmt(it.lastYear) + '千円）'
        : '前年の利益' + fmt(it.lastYear) + '千円（今年の実績は確認できず）';
      return '<div class="ctr-item">' +
          '<div class="ctr-top"><span class="ctr-name">' + esc(it.name) + (it.isNew ? '<span class="tag">新規</span>' : '') + '</span>' + amt + '</div>' +
          '<div class="ctr-note">' + note + '</div>' +
          '<div class="ctr-desc">' + esc(it.desc) + '</div>' +
        '</div>';
    }
    return '' +
      '<h2 class="sec" style="--sec-c:var(--' + scope.color + ')"><span class="bar"></span>取引動向（前年同月比較・8月度）</h2>' +
      '<div class="guide">' + esc(ct.note) + '</div>' +
      '<div class="ctr-cols">' +
        '<div class="ctr-col"><div class="ctr-col-title good">↑ 伸びているクライアント</div>' + ct.grown.map(function (it) { return item(it, "grown"); }).join("") + '</div>' +
        '<div class="ctr-col"><div class="ctr-col-title muted">今年は確認できないクライアント</div>' + ct.churned.map(function (it) { return item(it, "churned"); }).join("") + '</div>' +
      '</div>';
  }

  function topicsSection(scope) {
    if (!scope.topics) return "";
    return '' +
      '<h2 class="sec" style="--sec-c:var(--' + scope.color + ')"><span class="bar"></span>主な動き</h2>' +
      (scope.mainClients ? '<div class="guide">主要顧客：' + esc(scope.mainClients) + '</div>' : '') +
      (scope.topicsNote ? '<div class="guide">' + esc(scope.topicsNote) + '</div>' : '') +
      '<div class="topics-grid">' + scope.topics.map(function (t) {
        return '<div class="topic-card" style="--topic-c:var(--' + scope.color + ')"><div class="cli">' + esc(t.cli) + (t.tag ? '<span class="tag ' + t.tag + '">' + esc(t.tagLabel) + '</span>' : '') + '</div>' +
          '<div class="desc">' + t.desc + (t.who ? '<span class="who">（' + esc(t.who) + '）</span>' : '') + '</div></div>';
      }).join("") + '</div>';
  }

  function swingFactorsSection(scope) {
    if (!scope.swingFactors) return "";
    var sf = scope.swingFactors;
    var dirArrow = { up: "▲", down: "▼", flat: "―" };
    var itemsHtml = sf.items.map(function (it) {
      var dealsHtml = (it.deals || []).map(function (d) {
        return '<div class="swf-deal">' +
          '<span class="swf-dir ' + d.dir + '">' + dirArrow[d.dir] + '</span>' +
          '<span class="swf-deal-main"><span class="swf-deal-client">' + esc(d.client) + '</span>' +
            (d.desc ? '<span class="swf-deal-desc">' + esc(d.desc) + '</span>' : '') + '</span>' +
          '<span class="swf-deal-amount ' + d.dir + '">' + (d.dir === "down" ? "▲" : d.dir === "up" ? "+" : "") + fmt(d.amount) + '千円</span>' +
        '</div>';
      }).join("");
      return '<div class="swf-item">' +
        '<div class="swf-top"><span class="swf-month">' + esc(it.month) + '</span>' +
          (it.label ? '<span class="swf-label">' + esc(it.label) + '</span>' : '') +
        '</div>' +
        '<div class="swf-deals">' + dealsHtml + '</div>' +
        (it.note ? '<div class="swf-note">' + it.note + '</div>' : "") +
      '</div>';
    }).join("");
    return '<h2 class="sec" style="--sec-c:var(--' + scope.color + ')"><span class="bar"></span>' + esc(sf.title) + '</h2>' +
      (sf.note ? '<div class="guide">' + esc(sf.note) + '</div>' : "") +
      '<div class="swf-grid">' + itemsHtml + '</div>';
  }

  function blk(name, html) { return html ? '<div class="blk blk-' + name + '">' + html + '</div>' : ""; }

  function renderPanel(key) {
    var scope = DATA.scopes[key];
    var heroHtml = heroSection(scope) + (scope.monthlyUnavailableNote ? '<div class="guide">' + esc(scope.monthlyUnavailableNote) + '</div>' : "");
    var html = "";
    html += blk("hero", heroHtml);
    html += blk("ytd", ytdKpis(scope));
    html += blk("trend", trendSection(scope));
    html += blk("groups", groupsSection(scope));
    html += blk("crosstopics", crossTopicsSection(scope));
    html += blk("clienttrends", clientTrendsSection(scope));
    html += blk("topics", topicsSection(scope));
    html += blk("swingfactors", swingFactorsSection(scope));
    return html;
  }

  function formatAsOf(iso) {
    var d = new Date(iso + "T00:00:00+09:00");
    var days = ["日","月","火","水","木","金","土"];
    return "本日時点：" + d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日（" + days[d.getDay()] + "）";
  }

  function init() {
    var app = document.getElementById("app");
    var order = ["all", "g1", "g2", "g3", "content"];
    order.forEach(function (key, i) {
      var section = document.createElement("section");
      section.className = "panel" + (i === 0 ? " active" : "");
      section.id = "panel-" + key;
      section.innerHTML = renderPanel(key);
      app.appendChild(section);
    });

    document.getElementById("asOfLabel").textContent = formatAsOf(DATA.asOf);
    document.getElementById("pageFoot").innerHTML =
      '㈱宣伝　社内共有資料（機密）<br>' + esc(DATA.footerSource) +
      '<br>本資料は各データを機械的に集計・要約したものです。最新の数字が反映され次第、本URLの内容を随時更新します。';

    var buttons = document.querySelectorAll(".tab-btn");
    var panels = {}; order.forEach(function (k) { panels[k] = document.getElementById("panel-" + k); });
    function activate(key) {
      buttons.forEach(function (b) { b.setAttribute("aria-selected", b.dataset.tab === key ? "true" : "false"); });
      order.forEach(function (k) { panels[k].classList.toggle("active", k === key); });
      var active = document.querySelector('.tab-btn[data-tab="' + key + '"]');
      if (active) active.scrollIntoView({ behavior: "instant" in window ? "instant" : "auto", inline: "center", block: "nearest" });
      window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
      if (history.replaceState) history.replaceState(null, "", "#" + key);
    }
    buttons.forEach(function (b) { b.addEventListener("click", function () { activate(b.dataset.tab); }); });
    app.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-jump]");
      if (btn) activate(btn.dataset.jump);
    });
    var initial = (location.hash || "").replace("#", "");
    if (panels[initial]) activate(initial);

    var refreshBtn = document.getElementById("refreshBtn");
    if (refreshBtn) {
      refreshBtn.addEventListener("click", function () {
        refreshBtn.classList.add("spinning");
        refreshBtn.disabled = true;
        var unloaded = false;
        window.addEventListener("pagehide", function () { unloaded = true; });
        setTimeout(function () {
          if (unloaded) return;
          refreshBtn.classList.remove("spinning");
          refreshBtn.disabled = false;
          var note = document.getElementById("refreshFailNote");
          if (!note) {
            note = document.createElement("div");
            note.id = "refreshFailNote";
            note.style.cssText = "font-size:10.5px;color:var(--bad);width:100%;margin-top:6px;";
            note.textContent = "自動更新に失敗しました。ブラウザでこのページを閉じてから、リンクを開き直してください。";
            refreshBtn.closest(".top-datebar").insertAdjacentElement("afterend", note);
          }
        }, 1500);
        var url = new URL(location.href);
        url.searchParams.set("_r", Date.now());
        try { if (window.top && window.top !== window.self) { window.top.location.href = url.toString(); return; } } catch (e) {}
        location.replace(url.toString());
      });
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
